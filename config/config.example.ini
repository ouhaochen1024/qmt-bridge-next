; ============================================================
; qmt-bridge-next 统一配置模板 —— 复制为 config.ini 后填入真实值
; 桥接 / 大 QMT 执行器 / Agent Skills 三端共用，唯一配置源
; config.ini 已被 gitignore，真实账号/密钥不会进入 git 历史
; ============================================================

; --- 桥接 HTTP 监听 ---
; 默认只监听本机；需要局域网访问时改为 0.0.0.0，并务必配置 api_key
host = 127.0.0.1
port = 8000

; --- API Key（Skill 端 X-API-Key 必须与此一致；自行生成随机值） ---
api_key = 请填入你的随机APIKey

; --- 交易账户（执行器启动时 set_account） ---
account_id = 请填入普通资金账号

; --- 信用两融账号（可选；双账户复盘/两融 Skill 使用） ---
; credit_account_id =

; --- 默认户：stock / credit（可选，默认 stock） ---
; default_account = stock

; --- 信箱目录（绝对路径，或相对本文件所在目录；盖戳脚本写入执行器 BASE_DIR） ---
base_dir = D:/qmt-bridge-next/mailbox
