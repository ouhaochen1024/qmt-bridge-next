; ============================================================
; qmt-bridge-next 统一配置模板 —— 复制为 config.ini 后填入真实值
; config.ini 已被 gitignore，真实账号/密钥不会进入 git 历史
; ============================================================

; --- 桥接 HTTP 监听 ---
host = 0.0.0.0
port = 8000

; --- API Key（Skill 端 X-API-Key 必须与此一致；自行生成随机值） ---
api_key = 请填入你的随机APIKey

; --- 交易账户（执行器启动时 set_account） ---
account_id = 请填入资金账号

; --- 信箱目录 ---
base_dir = D://big-qmt-agent-skill//qmt-bridge-next//mailbox/n